name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Update module.json for release
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          jq --arg version "$VERSION" \
             --arg download "https://github.com/Hamilcarbarcas/pf1-new-script-hooks/releases/download/v${VERSION}/pf1-new-script-hooks.zip" \
             '.version = $version | .download = $download' \
             module.json > module.json.tmp && mv module.json.tmp module.json

      - name: Create zip
        run: zip -r pf1-new-script-hooks.zip module.json src/

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { flag=1; next }
            index($0, "## [") == 1 { flag=0 }
            flag { print }
          ' CHANGELOG.md > RELEASE_BODY.md
          if [ ! -s RELEASE_BODY.md ]; then
            echo "::error::No CHANGELOG.md section found for version $VERSION"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pf1-new-script-hooks.zip
            module.json
          body_path: RELEASE_BODY.md
